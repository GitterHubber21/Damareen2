<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.login.title">Damareen - Bejelentkezés/Regisztráció</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="src/favicon.ico">
    <link rel="shortcut icon" href="src/favicon.ico">
    <script src="src/i18n.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Jaro', sans-serif;
            background: #1A1A1D url('src/background.png') center/cover no-repeat fixed;
            color: #D9D9D9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #auth-container {
            width: 100%;
            max-width: 520px;
        }

        .form-container {
            text-align: center;
            padding: 35px 25px;
            border: 2.5px solid rgba(196, 155, 59, 0.4);
            border-radius: 15px;
            background: rgba(26, 26, 29, 0.75);
            box-shadow: 0 4px 15px rgba(196, 155, 59, 0.2);
        }

        h2 {
            font-family: 'Jaro', sans-serif;
            font-size: 3.2rem;
            font-weight: bold;
            color: #C49B3B;
            margin-bottom: 55px;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(196, 155, 59, 0.5);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        form > div {
            width: 100%;
            max-width: 415px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #D9D9D9;
            font-size: 1.05rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 22px;
            background: rgba(26, 26, 29, 0.6);
            border: 2px solid rgba(196, 155, 59, 0.3);
            border-radius: 8px;
            color: #D9D9D9;
            font-size: 1.02rem;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #C49B3B;
            background: rgba(26, 26, 29, 0.8);
            box-shadow: 0 4px 15px rgba(196, 155, 59, 0.3);
        }

        button[type="submit"] {
            margin-top: 24px;
            padding: 13px 55px;
            background: transparent;
            border: 3px solid #C49B3B;
            border-radius: 8px;
            color: #C49B3B;
            font-family: 'Jaro', sans-serif;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(196, 155, 59, 0.2);
            letter-spacing: 2px;
            position: relative;
        }

        button[type="submit"]:hover {
            background: #C49B3B;
            color: #1A1A1D;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(196, 155, 59, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }

        button[type="submit"].loading {
            pointer-events: none;
            color: transparent;
        }

        button[type="submit"] .button-spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(196, 155, 59, 0.2);
            border-top: 3px solid #C49B3B;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        button[type="submit"].loading .button-spinner {
            display: block;
        }

        p {
            margin-top: 22px;
            color: #D9D9D9;
            font-size: 0.98rem;
        }

        a {
            color: #C49B3B;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s;
        }

        a:hover {
            color: #d4ab4f;
            border-bottom-color: #C49B3B;
        }

            ::selection {
                  background: #C49B3B;
                  color: #1A1A1D;
            }
            ::-moz-selection {
                  background: #C49B3B;
                  color: #1A1A1D;
            }

        #login-message,
        #register-message,
        #resend-message {
            margin-top: 16px;
            font-weight: bold;
            min-height: 22px;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
            @media (max-width: 600px) {
                body {
                    padding: 8px;
                    min-height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }
                #auth-container {
                    max-width: 100vw;
                    width: 100vw;
                    padding: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                }
                .form-container {
                    padding: 18px 7px;
                    border-width: 2px;
                    border-radius: 10px;
                    box-shadow: 0 2px 8px rgba(196, 155, 59, 0.18);
                }
                h2 {
                    font-size: 2.1rem;
                    margin-bottom: 30px;
                    letter-spacing: 2px;
                    text-shadow: 0 0 12px rgba(196, 155, 59, 0.3);
                }
                form > div {
                    max-width: 98vw;
                }
                input[type="text"],
                input[type="email"],
                input[type="password"] {
                    padding: 10px 12px;
                    font-size: 0.98rem;
                }
                button[type="submit"] {
                    padding: 10px 0;
                    font-size: 1.05rem;
                    width: 100%;
                    min-width: 0;
                }
                p {
                    font-size: 0.93rem;
                }
                label {
                    font-size: 0.98rem;
                }
            }
        
        /* Language toggle styles */
        #lang-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: rgba(26, 26, 29, 0.8);
            border: 2px solid rgba(196, 155, 59, 0.4);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(196, 155, 59, 0.2);
        }
        
        #lang-toggle:hover {
            border-color: #C49B3B;
            background: rgba(26, 26, 29, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 155, 59, 0.4);
        }
        
        #lang-toggle::after {
            content: '🇬🇧';
        }
        
        #lang-toggle[data-lang="hu"]::after {
            content: '🇭🇺';
        }
        
        @media (max-width: 600px) {
            #lang-toggle {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <button id="lang-toggle" title="Change language / Nyelv váltása"></button>
    <div id="auth-container">
        <div id="login-form" class="form-container">
            <h2 data-i18n="auth.login.title">Damareen Login</h2>
            <form id="loginForm">
                <div>
                    <label for="login-username" data-i18n="auth.login.username">Felhasználónév vagy E-mail:</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div>
                    <label for="login-password" data-i18n="auth.login.password">Jelszó:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" id="login-btn">
                    <span class="button-text" data-i18n="auth.login.button">Bejelentkezés</span>
                    <span class="button-spinner"></span>
                </button>
                <p id="login-message"></p>
            </form>
            <p><span data-i18n="auth.login.noAccount">Nincs még fiókod?</span> <a href="#" id="show-register" data-i18n="auth.login.registerLink">Regisztrálj itt</a></p>
        </div>

        <div id="register-form" class="form-container" style="display: none;">
            <h2 data-i18n="auth.register.title">Damareen Register</h2>
            <form id="registerForm">
                <div>
                    <label for="register-username" data-i18n="auth.register.username">Felhasználónév:</label>
                    <input type="text" id="register-username" name="username" required>
                </div>
                <div>
                    <label for="register-email" data-i18n="auth.register.email">E-mail:</label>
                    <input type="email" id="register-email" name="email" required>
                </div>
                <div>
                    <label for="register-password" data-i18n="auth.register.password">Jelszó:</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <div>
                    <label for="register-password-confirm" data-i18n="auth.register.confirmPassword">Jelszó megerősítése:</label>
                    <input type="password" id="register-password-confirm" name="password-confirm" required>
                </div>
                <button type="submit" id="register-btn">
                    <span class="button-text" data-i18n="auth.register.button">Regisztráció</span>
                    <span class="button-spinner"></span>
                </button>
                <p id="register-message"></p>
            </form>
            <p><span data-i18n="auth.register.hasAccount">Van már fiókod?</span> <a href="#" id="show-login" data-i18n="auth.register.loginLink">Jelentkezz be itt</a></p>
        </div>
    </div>

    <script>
        (function() {
            if (localStorage.getItem('token') || localStorage.getItem('user')) {
                window.location.href = '/';
            }
        })();
        const API_URL = 'https://damareen2-production.up.railway.app/user';

        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
    
        const loginContainer = document.getElementById('login-form');
        const registerContainer = document.getElementById('register-form');
        
        const loginMessage = document.getElementById('login-message');
        const registerMessage = document.getElementById('register-message');

            document.getElementById('show-register').addEventListener('click', (e) => {
                e.preventDefault();
                loginContainer.style.display = 'none';
                registerContainer.style.display = 'block';
            });

            document.getElementById('show-login').addEventListener('click', (e) => {
                e.preventDefault();
                loginContainer.style.display = 'block';
                registerContainer.style.display = 'none';
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginMessage.textContent = '';
                const loginBtn = document.getElementById('login-btn');
                loginBtn.classList.add('loading');
                const username = document.getElementById('login-username').value;
                const password = document.getElementById('login-password').value;

                try {
                    const response = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();
                    loginBtn.classList.remove('loading');
                    if (data.success) {
                        loginMessage.textContent = data.data.message;
                        loginMessage.style.color = 'green';
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        loginMessage.textContent = data.error;
                        loginMessage.style.color = 'red';
                    }
                } catch (error) {
                    loginBtn.classList.remove('loading');
                    loginMessage.textContent = i18n.translate('auth.login.error') + error.message;
                    loginMessage.style.color = 'red';
                    console.error('Bejelentkezési hiba:', error);
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                registerMessage.textContent = '';
                const registerBtn = document.getElementById('register-btn');
                const username = document.getElementById('register-username').value;
                const email = document.getElementById('register-email').value;
                const password = document.getElementById('register-password').value;
                const passwordConfirm = document.getElementById('register-password-confirm').value;

                if (password !== passwordConfirm) {
                    registerMessage.textContent = i18n.translate('auth.register.passwordMismatch');
                    registerMessage.style.color = 'red';
                    return;
                }

                registerBtn.classList.add('loading');

                try {
                    const response = await fetch(`${API_URL}/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, email, password })
                    });
                    const data = await response.json();
                    registerBtn.classList.remove('loading');
                    if (data.success) {
                        registerMessage.textContent = data.data.message;
                        registerMessage.style.color = 'green';
                        localStorage.setItem('token', data.data.token);
                        localStorage.setItem('user', JSON.stringify(data.data.user));
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        registerMessage.textContent = data.error;
                        registerMessage.style.color = 'red';
                    }
                } catch (error) {
                    registerBtn.classList.remove('loading');
                    registerMessage.textContent = i18n.translate('auth.register.error') + error.message;
                    registerMessage.style.color = 'red';
                    console.error('Regisztrációs hiba:', error);
                }
            });
        </script>
